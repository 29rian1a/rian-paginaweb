<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Tech</title>
    <style>
        :root {
            --cor-primaria: #183C63;
            --cor-secundaria: #3782d2;
            --cor-fundo: #ffffff;
            --cor-texto: #151428;
            --cor-contraste: #f3eef7;
            --cor-botao: #f9f9f9;
            --fonte-texto: 'Segoe UI', sans-serif;
        }

        /* Aplica a transição suave para mudança de tema em todos os elementos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .tema-escuro {
            --cor-primaria: #c9e3ff;
            --cor-fundo: #151428;
            --cor-texto: #ffffff;
            --cor-contraste: #f3eef7;
            --cor-secundaria: #4a90e2;
            --cor-botao: #201f3d;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-family: var(--fonte-texto);
            line-height: 1.6;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--cor-secundaria);
            margin-bottom: 30px;
        }

        h1 {
            color: var(--cor-primaria);
        }

        .btn-tema {
            background-color: var(--cor-botao);
            color: var(--cor-texto);
            border: 1px solid var(--cor-secundaria);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-tema:hover {
            opacity: 0.9;
        }

        .artigo {
            background-color: var(--cor-botao);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .artigo h2 {
            color: var(--cor-secundaria);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Blog Tech</h1>
        <button id="btnAlternarTema" class="btn-tema">Alternar Tema</button>
    </header>

    <main>
        <article class="artigo">
            <h2>Bem-vindo ao Blog Tech</h2>
            <p>Este é um exemplo de publicação para demonstrar a alternância entre o modo claro e escuro utilizando CSS e JavaScript.</p>
        </article>
    </main>

    <script>
        const btnAlternar = document.getElementById('btnAlternarTema');
        
        btnAlternar.addEventListener('click', () => {
            document.body.classList.toggle('tema-escuro');
        });
    </script>

</body>
</html>
